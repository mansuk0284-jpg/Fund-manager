<style>

</head>
<body>
<div id="app"></div>

<script>
// ═══════════════ 데이터 ═══════════════
// 개인 금융정보는 코드에 넣지 않는다 (공개 저장소). 데이터는 기기 저장소와 백업 파일에만 보관
const DEFAULT_LOANS = [];
const DEFAULT_ASSETS = [];
const KIND_COLORS = { 주식:"#e8590c", 예금:"#2f9e44", 현금:"#3b5bdb", 기타:"#868e96" };
// 금융기관 접속 링크 (앱 설치 시 앱으로, 아니면 웹/검색으로 연결)
const BANK_LINKS = {

  "우리금융":"https://spot.wooribank.com/",

  "광주":"https://www.kjbank.com/",

  "SBI저축":"https://www.sbisb.co.kr/",

  "농협":"https://banking.nonghyup.com/",

// 안드로이드 앱 패키지명 (플레이스토어에서 확인된 것만 · 앱 설치 시 앱으로 실행)
const BANK_PACKAGES = {
  "카카오페이":"com.kakaopay.app",
  "카카오뱅크":"com.kakaobank.channel",
  "카카오":"com.kakaobank.channel",
  "KB국민":"com.kbstar.kbbank",
  "KB":"com.kbstar.kbbank",
  "국민":"com.kbstar.kbbank",
  "우리":"com.wooribank.smart.npib",
  "우리은행":"com.wooribank.smart.npib",
  "우리금융":"com.wooribank.smart.npib",
  "부산은행":"kr.co.busanbank.mbp",
  "부산":"kr.co.busanbank.mbp",
  "광주":"com.kjbank.asb.pbanking",
  "케이뱅크":"com.kbankwith.smartbank",
  "SBI":"com.sbi.saidabank",
  "삼성카드":"kr.co.samsungcard.mpocket",
  "신한":"com.shinhan.sbanking",
  "하나":"com.kebhana.hanapush",
  "농협":"nh.smart.banking",
  "NH":"nh.smart.banking",
  "키움":"com.kiwoom.heromts",
  "토스":"viva.republica.toss",
};
const intentLink = pkg => "intent://launch#Intent;scheme=app;package="+pkg+";S.browser_fallback_url="+encodeURIComponent("https://play.google.com/store/apps/details?id="+pkg)+";end";
function findBankPackage(name){
  if(!name) return "";
  for(const key in BANK_PACKAGES){ if(name.includes(key)) return BANK_PACKAGES[key]; }
  return "";
}
// 저장된 링크 열기 (intent:// 또는 http)
function openLink(url){
  if(!url) return;
  if(url.startsWith("intent://")){ window.location.href=url; }
  else { window.open(url,"_blank"); }
}
// 이름으로 링크 찾기(부분일치)
function findBankLink(name){
  if(!name) return "";
  for(const key in BANK_LINKS){ if(name.includes(key)) return BANK_LINKS[key]; }
  return "";
}
// HTML 이스케이프 (이름·메모 등 사용자 입력을 화면에 넣을 때)
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const nowYM = () => ymOf(new Date());
const isYM = s => /^\d{4}-(0[1-9]|1[0-2])$/.test(s);

// ═══════════════ 저장소 ═══════════════
const DB = "assetmgr_v1";
const BACKUP_KEY = "assetmgr_lastbackup";
const freshState = () => ({ loans:DEFAULT_LOANS.map(l=>({...l})), assets:DEFAULT_ASSETS.map(a=>({...a})), paid:{}, paidYM:nowYM(), history:[], moves:[] });
// 저장본(또는 백업 파일)을 상태로 변환. 저장본의 대출 목록을 그대로 신뢰한다
// (삭제·완납한 대출을 기본값에서 되살리지 않음)
// 예전 버전이 저장한, 플레이스토어에 없는 잘못된 패키지명 → 올바른 패키지명
const PKG_FIXES = { "com.webcash.wooriabank":"kr.co.busanbank.mbp", "kr.co.sbibank.smart":"com.sbi.saidabank", "nh.smart":"nh.smart.banking", "com.kakaopaysec":"com.kakaopay.app" };
function fixLink(x){
  const mm = x && typeof x.link==="string" && x.link.match(/;package=([^;]+);/);
  return (mm && PKG_FIXES[mm[1]]) ? {...x, link:intentLink(PKG_FIXES[mm[1]])} : x;
}
function normalize(d){
  const f=freshState();
  const isObj = x => x && typeof x==="object";
  // 계산에 쓰는 값은 형식을 보정 (손상된 저장본·백업 파일로 화면이 깨지지 않게)
  const fixLoan = l => fixLink({...l, lender:String(l.lender||"이름없음"), balance:Number(l.balance)||0, rate:Number(l.rate)||0, months:Number(l.months)||0, payDay:Number(l.payDay)||1, startYM:isYM(l.startYM)?l.startYM:nowYM()});
  const fixAsset = a => fixLink({...a, name:String(a.name||"이름없음"), amount:Number(a.amount)||0, kind:KIND_COLORS[a.kind]?a.kind:"기타"});
  return {
    loans: Array.isArray(d.loans) ? d.loans.filter(isObj).map(fixLoan) : f.loans,
    assets: Array.isArray(d.assets) ? d.assets.filter(isObj).map(fixAsset) : f.assets,
    paid: (d.paid && typeof d.paid==="object") ? d.paid : {},
    paidYM: d.paidYM || nowYM(),
    history: Array.isArray(d.history) ? d.history.filter(isObj) : [],
    moves: Array.isArray(d.moves) ? d.moves.filter(isObj) : [],
  };
}
function load() {
  const raw = localStorage.getItem(DB);
  if (!raw) return freshState();
  try { return normalize(JSON.parse(raw)); }
  catch(e) {
    // 손상된 저장본은 덮어쓰기 전에 따로 보관
    try { localStorage.setItem(DB+"_corrupt", raw); } catch(_){}
    return freshState();
  }
}
const snapshot = () => ({ loans:state.loans, assets:state.assets, paid:state.paid, paidYM:state.paidYM, history:state.history, moves:state.moves });
function save(quiet) {
  try {
    localStorage.setItem(DB, JSON.stringify(snapshot()));
    if(!quiet) toast("저장됨");
  } catch(e) { toast("⚠️ 저장 실패 · 저장공간을 확인하세요", 3000); }
}
let saveTimer=null;
function toast(msg, ms){
  clearTimeout(saveTimer);
  let t=document.querySelector(".savedtoast");
  if(!t){ t=document.createElement("div"); t.className="savedtoast"; document.body.appendChild(t); }
  t.textContent=msg;
  // 숨김 타이머는 표시된 뒤에 시작 (순서가 뒤집혀 토스트가 계속 남는 것 방지)
  requestAnimationFrame(()=>{ t.classList.add("show"); clearTimeout(saveTimer); saveTimer=setTimeout(()=>t.classList.remove("show"),ms||1200); });
}
// 달이 바뀌면 '이번 달 납입 체크'를 초기화
function rollMonth(){
  const ym=nowYM();
  if(state.paidYM!==ym){
    state.paid={}; state.paidYM=ym;
    state.loans=state.loans.filter(l=>l.balance>0); // 납입 체크로 완납된 대출 정리
    save(true);
  }
}

// ═══════════════ 계산 ═══════════════
const won = n => Math.round(n).toLocaleString("ko-KR");
// 입력창에 천단위 콤마 자동 적용 (type=text 대상)
function attachComma(input){
  if(!input) return;
  input.setAttribute("inputmode","numeric");
  input.oninput = ()=>{
    const raw=input.value.replace(/[^0-9]/g,'');
    input.value = raw===''?'':Number(raw).toLocaleString('ko-KR');
    try{ const L=input.value.length; input.setSelectionRange(L,L); }catch(_){}
  };
}
const numVal = el => el ? Number(el.value.replace(/,/g,''))||0 : 0;
const monthlyInterest = (bal,rate) => bal*(rate/100)/12;
function amort(p,rate,m){ if(m<=0) return 0; const r=rate/100/12; if(r===0) return p/m; return p*r*Math.pow(1+r,m)/(Math.pow(1+r,m)-1); }
function fixedMonthly(l){ if(l.type!=="원리금") return monthlyInterest(l.balance,l.rate); return amort(l.orig||l.balance, l.rate, l.months); }
// 원리금 납입액 중 원금 상환분 (납입 체크 시 잔액에서 차감할 금액)
function principalPortion(l){
  if(l.type!=="원리금") return 0;
  return Math.min(l.balance, Math.max(0, Math.round(fixedMonthly(l)-monthlyInterest(l.balance,l.rate))));
}
// 다음 납입일까지 남은 일수 (31일 납입인데 30일까지인 달은 말일로 계산)
function daysUntilPay(payDay){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth(), d=n.getDate();
  const dim=(yy,mm)=>new Date(yy,mm+1,0).getDate();
  const thisDue=Math.min(payDay, dim(y,m));
  if(thisDue>=d) return thisDue-d;
  return (dim(y,m)-d)+Math.min(payDay, dim(y,m+1));
}
const monthlyPayment = l => fixedMonthly(l);
function paymentInMonth(l, ym){
  if(l.firstYM && l.firstYM===ym) return l.firstAmount;
  if(l.type==="원리금"){
    const [sy,sm]=l.startYM.split("-").map(Number);
    const [y,m]=ym.split("-").map(Number);
    const idx=(y-sy)*12+(m-sm);
    if(idx<0||idx>=l.months) return 0;
    return fixedMonthly(l);
  }
  return monthlyInterest(l.balance, l.rate);
}
// 만기월에 원금 일시상환 금액 (해당 월이 만기면 잔액 반환)
function maturityInMonth(l, ym){
  if(l.maturityYM && l.maturityYM===ym) return l.balance;
  return 0;
}

// ═══════════════ 알림·문자 분석 ═══════════════
// 같은 기관을 가리키는 표기들 (알림 문구 ↔ 앱에 등록한 계좌 이름 매칭용)
const BANK_ALIASES = [
  ["카카오뱅크","카뱅","kakaobank"],["카카오페이"],["KB","국민"],["우리"],["부산","BNK"],["광주"],
  ["케이뱅크","K뱅크","Kbank"],["키움"],["SBI","사이다"],["삼성카드"],["신한"],["하나"],["농협","NH"],
  ["IBK","기업"],["토스"],["새마을","MG"],["신협"],["우체국"],["미래에셋"],["삼성증권"],["한국투자","한투"],
];
function parseNotice(text){
  const num = s => Number(String(s).replace(/[^0-9]/g,''))||0;
  const bal = text.match(/(?:대출\s*잔액|잔액|잔고|평가\s*금액|총\s*평가|예탁\s*자산|총\s*자산|예수금)\s*[:：]?\s*([0-9][0-9,]*)\s*원?/);
  const tx = text.match(/(입금|출금|이체|결제|승인|매수|매도|상환)\s*[:：]?\s*([0-9][0-9,]*)\s*원?/);
  const txKind = tx ? tx[1] : "";
  const reasons = { 입금:"급여·입금", 매도:"매도 정산", 출금:"생활비 지출", 이체:"생활비 지출", 결제:"카드값", 승인:"카드값", 매수:"주식 매수", 상환:"대출 상환" };
  return { balance: bal?num(bal[1]):null, txKind, txAmount: tx?num(tx[2]):0, txIn: txKind==="입금"||txKind==="매도", isLoan:/대출/.test(text), reason: reasons[txKind]||"" };
}
// 알림 문구에 등장하는 기관명으로 계좌(A…)·대출(L…) 추정
function guessTarget(text, preferLoan){
  const low=text.toLowerCase();
  const score = name => {
    const n=String(name).toLowerCase();
    let s = low.includes(n) ? 3 : 0;
    BANK_ALIASES.forEach(g=>{ if(g.some(k=>low.includes(k.toLowerCase())) && g.some(k=>n.includes(k.toLowerCase()))) s+=2; });
    return s;
  };
  const cands=[...state.assets.map(a=>({v:"A"+a.id, s:score(a.name)+(preferLoan?0:1)})), ...state.loans.map(l=>({v:"L"+l.id, s:score(l.lender)+(preferLoan?1:0)}))].filter(c=>c.s>=2);
  cands.sort((a,b)=>b.s-a.s);
  return cands.length ? cands[0].v : "";
}

// ═══════════════ 상태 ═══════════════
let state = load();
let ui = { tab:"dash", openMonth:null, focusAsset:null, draft:"", showAllHist:false, showAllMoves:false, modal:null };
const todayStamp = () => { const d=new Date(); return { date:`${d.getMonth()+1}/${d.getDate()}`, fullDate:`${ymOf(d)}-${String(d.getDate()).padStart(2,"0")}` }; };
// 자산 금액 변경 + 변동내역(그 시점 순자산 포함) 기록
function applyAssetChange(id, next, reason){
  const a=state.assets.find(x=>x.id===id); if(!a) return;
  const prev=a.amount;
  state.assets=state.assets.map(x=>x.id===id?{...x,amount:next}:x);
  const totalA=state.assets.reduce((s,x)=>s+x.amount,0);
  const totalD=state.loans.reduce((s,l)=>s+l.balance,0);
  state.history=[{id:Date.now(),...todayStamp(),name:a.name,prev,next,reason,totalAsset:totalA,totalDebt:totalD,net:totalA-totalD},...state.history];
}

// ═══════════════ 렌더 ═══════════════
const app = document.getElementById("app");
function h(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }

function render(){
  rollMonth();
  const totalDebt = state.loans.reduce((s,l)=>s+l.balance,0);
  const totalAsset = state.assets.reduce((s,a)=>s+a.amount,0);
  const net = totalAsset - totalDebt;
  const mInt = state.loans.reduce((s,l)=>s+monthlyInterest(l.balance,l.rate),0);
  const payable = state.loans.filter(l=>monthlyPayment(l)>0);
  const paidCount = payable.filter(l=>state.paid[l.id]).length;
  const payableTotal = payable.length;

  app.innerHTML = "";
  // 헤더
  const headBg = net>=0 ? "linear-gradient(160deg,#12352a,#1d5c43)" : "linear-gradient(160deg,#3a1720,#6b2331)";
  app.appendChild(h(`
    <header style="background:${headBg}">
      <div class="htop"><span class="dot" style="background:${net>=0?'#5be3a5':'#ff8a9b'}"></span><span class="brand">실질 자산 현황</span><button class="backupbtn" style="margin-left:auto;color:rgba(255,255,255,.6);font-size:16px;padding:2px 6px">💾</button><button class="lockbtn" style="color:rgba(255,255,255,.6);font-size:16px;padding:2px 6px">🔒</button></div>
      <div class="netlabel">순자산 (자산 − 부채)</div>
      <div class="netval">${net>=0?'+':'−'}${won(Math.abs(net))}<small>원</small></div>
      <div class="mrow">
        <div class="metric"><div class="mlabel">총 자산</div><div class="mval">${won(totalAsset)}</div></div>
        <div class="mdiv"></div>
        <div class="metric"><div class="mlabel">총 부채</div><div class="mval">${won(totalDebt)}</div></div>
        <div class="mdiv"></div>
        <div class="metric"><div class="mlabel">월 이자</div><div class="mval">${won(mInt)}</div></div>
      </div>
    </header>
    <div class="progwrap">
      <div class="progtext"><span>이번 달 납입 체크</span><b>${paidCount} / ${payableTotal}</b></div>
      <div class="progbar"><div class="progfill" style="width:${paidCount/Math.max(payableTotal,1)*100}%"></div></div>
    </div>
  `));
  const lb = app.querySelector(".lockbtn");
  if(lb) lb.onclick = ()=>{ ui.modal={type:"lockset"}; render(); };
  app.querySelector(".backupbtn").onclick = ()=>{ ui.modal={type:"backup"}; render(); };

  // 탭
  const nav = h(`<nav></nav>`);
  [["dash","홈"],["net","자산"],["trend","추이"],["home","납입"],["year","일정"],["priority","순위"],["all","대출"]].forEach(([k,label])=>{
    const b=h(`<button class="${ui.tab===k?'on':''}">${label}</button>`);
    b.onclick=()=>{ ui.tab=k; render(); };
    nav.appendChild(b);
  });
  app.appendChild(nav);

  const main = h(`<main></main>`);
  app.appendChild(main);
  if(ui.tab==="dash") renderDash(main, totalAsset, totalDebt, net, mInt);
  else if(ui.tab==="net") renderAssets(main, totalAsset);
  else if(ui.tab==="trend") renderTrend(main, totalAsset, totalDebt, net);
  else if(ui.tab==="home") renderHome(main);
  else if(ui.tab==="year") renderYear(main);
  else if(ui.tab==="priority") renderPriority(main);
  else if(ui.tab==="all") renderAll(main);

  if(ui.modal) renderModal();
  maybeInstallBar();
}

function renderDash(main, totalAsset, totalDebt, net, mInt){
  // 자산 구성 (종류별)
  const kinds=["주식","예금","현금","기타"];
  const kindSums={}; kinds.forEach(k=>kindSums[k]=state.assets.filter(a=>a.kind===k).reduce((s,a)=>s+a.amount,0));
  const assetTotal=totalAsset||1;

  // 이번 달 상환 합계 (payable)
  const payable=state.loans.filter(l=>monthlyPayment(l)>0);
  const monthPay=payable.reduce((s,l)=>s+monthlyPayment(l),0);

  // 만기 임박 대출
  const now=new Date();
  const maturing=state.loans.filter(l=>l.maturityYM).map(l=>{
    const [my,mm]=l.maturityYM.split("-").map(Number);
    return {l, monthsLeft:(my-now.getFullYear())*12+(mm-(now.getMonth()+1)), my, mm};
  }).filter(x=>x.monthsLeft>=0).sort((a,b)=>a.monthsLeft-b.monthsLeft);

  // 자산 구성 바
  const compBar = kinds.filter(k=>kindSums[k]>0).map(k=>`<div style="width:${kindSums[k]/assetTotal*100}%;background:${KIND_COLORS[k]}"></div>`).join("");
  const compLegend = kinds.filter(k=>kindSums[k]>0).map(k=>`<div class="leg"><span class="legdot" style="background:${KIND_COLORS[k]}"></span>${k} ${won(kindSums[k])} <b>${Math.round(kindSums[k]/assetTotal*100)}%</b></div>`).join("");

  // 부채 대비 자산 비율(재무 건전성)
  const ratio = totalDebt>0 ? Math.round(totalAsset/totalDebt*100) : 999;

  // ── 월별 수익 집계 ──
  // 실제 번 돈만: 수익성 사유로 자산이 증가한 것 + 외부수입 자금이동
  const INCOME_REASONS=["급여·입금","주식 상승","이자·배당","매도 정산","외부 수입","수입","급여","배당","이자"];
  const isIncome = r => r && INCOME_REASONS.some(k=>r.includes(k));
  const ymKey = d => d ? d.slice(0,7) : "";
  const thisYM = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  // history 기반 (자산 증가분 중 수익성)
  const incomeByMonth={};
  (state.history||[]).forEach(hh=>{
    if(hh.next>hh.prev && isIncome(hh.reason)){
      const km = hh.fullDate ? hh.fullDate.slice(0,7) : thisYM;
      incomeByMonth[km]=(incomeByMonth[km]||0)+(hh.next-hh.prev);
    }
  });
  // moves 기반 (외부 수입 → 자산/대출)
  (state.moves||[]).forEach(mv=>{
    if(mv.from==="외부 수입"){
      const km = mv.fullDate? mv.fullDate.slice(0,7) : thisYM;
      incomeByMonth[km]=(incomeByMonth[km]||0)+mv.amount;
    }
  });
  const thisMonthIncome = incomeByMonth[thisYM]||0;
  // 최근 6개월 추이
  const last6=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    const km=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    last6.push({label:`${d.getMonth()+1}월`, val:incomeByMonth[km]||0});
  }
  const maxIncome=Math.max(...last6.map(x=>x.val),1);
  const totalIncome6=last6.reduce((s,x)=>s+x.val,0);

  main.appendChild(h(`
    <div class="dashsummary">
      <div class="dsrow">
        <div class="dscell">
          <div class="dslabel">총 자산</div>
          <div class="dsval" style="color:var(--good)">${won(totalAsset)}</div>
        </div>
        <div class="dscell">
          <div class="dslabel">총 부채</div>
          <div class="dsval" style="color:var(--hot)">${won(totalDebt)}</div>
        </div>
      </div>
      <div class="dsrow2">
        <div class="dscell">
          <div class="dslabel">이번 달 상환</div>
          <div class="dsval2">${won(monthPay)}<small>원</small></div>
        </div>
        <div class="dscell">
          <div class="dslabel">월 이자부담</div>
          <div class="dsval2">${won(mInt)}<small>원</small></div>
        </div>
        <div class="dscell">
          <div class="dslabel">자산/부채</div>
          <div class="dsval2" style="color:${ratio>=100?'var(--good)':'var(--hot)'}">${ratio>=999?'∞':ratio+'%'}</div>
        </div>
      </div>
    </div>
  `));

  // 이번 달 수익 카드 (간단)
  const incHtml = '<div class="incomecard"><div class="inclabel">이번 달 수익</div><div class="incval">+'+won(thisMonthIncome)+'<small>원</small></div><div class="inc6simple">최근 6개월 +'+won(totalIncome6)+'원</div></div>';
  main.appendChild(h(incHtml));

  // 자산 구성
  main.appendChild(h(`
    <div class="dashcard">
      <div class="dashtitle">자산 구성</div>
      ${totalAsset>0?`<div class="compbar">${compBar}</div><div class="leglist">${compLegend}</div>`:`<div class="dashempty">자산 탭에서 금액을 입력하면 구성이 표시됩니다.</div>`}
    </div>
  `));

  // 자금 이동 기록 버튼 + 최근 내역
  const moveCard=h(`
    <div class="dashcard">
      <div class="dashtitle">자금 이동 <button class="movebtn">＋ 기록</button></div>
      <div class="movelist"></div>
    </div>
  `);
  moveCard.querySelector(".movebtn").onclick=()=>{ ui.modal={type:"move"}; render(); };
  const ml=moveCard.querySelector(".movelist");
  if(!state.moves||state.moves.length===0){
    ml.appendChild(h(`<div class="dashempty">주식 수익으로 대출을 갚거나, 예금↔대출 등 자금을 옮기면 여기에 기록됩니다.</div>`));
  } else {
    (ui.showAllMoves?state.moves:state.moves.slice(0,6)).forEach(mv=>{
      const item=h(`<div class="moveitem">
        <div class="moveicon" style="background:${mv.kind==='상환'?'#eefaf1':'#eef1fd'}">${mv.kind==='상환'?'↓':'↔'}</div>
        <div class="moveinfo"><div class="movefromto">${esc(mv.from)} → ${esc(mv.to)}</div><div class="movedate">${esc(mv.date)}${mv.memo?' · '+esc(mv.memo):''}</div></div>
        <div class="moveamt">${won(mv.amount)}</div>
        <button class="del">✕</button>
      </div>`);
      item.querySelector(".del").onclick=()=>{
        if(confirm('이 자금 이동 기록을 삭제할까요?\n(기록만 지워지고, 이미 반영된 계좌·대출 잔액은 그대로입니다)')){ state.moves=state.moves.filter(x=>x.id!==mv.id); save(); render(); }
      };
      ml.appendChild(item);
    });
    if(state.moves.length>6){
      const more=h(`<button class="histmore">${ui.showAllMoves?'접기':'전체 '+state.moves.length+'건 보기'}</button>`);
      more.onclick=()=>{ ui.showAllMoves=!ui.showAllMoves; render(); };
      ml.appendChild(more);
    }
  }
  main.appendChild(moveCard);

  // 만기 임박
  if(maturing.length){
    const mc=h(`<div class="dashcard"><div class="dashtitle">만기 예정</div></div>`);
    maturing.forEach(({l,monthsLeft,my,mm})=>{
      mc.appendChild(h(`<div class="matrow ${monthsLeft<=3?'urgent':''}">
        <div class="matinfo"><div class="matname">${esc(l.lender)}</div><div class="matsub">${my}.${mm} · 원금 ${won(l.balance)}원 일시상환</div></div>
        <div class="matleft ${monthsLeft<=3?'urgent':''}">${monthsLeft}개월 후</div>
      </div>`));
    });
    main.appendChild(mc);
  }

  // 상환 우선순위 top3 요약
  const top3=[...state.loans].filter(l=>l.rate>0).sort((a,b)=>b.rate-a.rate).slice(0,3);
  if(top3.length){
    const pc=h(`<div class="dashcard"><div class="dashtitle">먼저 갚으면 좋은 대출</div></div>`);
    top3.forEach((l,i)=>{
      pc.appendChild(h(`<div class="matrow">
        <div class="matinfo"><div class="matname">${i+1}. ${esc(l.lender)}</div><div class="matsub">잔액 ${won(l.balance)}원</div></div>
        <div class="matleft" style="color:var(--hot)">${l.rate.toFixed(2)}%</div>
      </div>`));
    });
    main.appendChild(pc);
  }
}

function renderTrend(main, totalAsset, totalDebt, net){
  main.appendChild(h(`<div class="hint">📈 자산을 수정할 때마다 그 시점의 순자산이 기록됩니다. 일자별로 변화를 확인하세요.</div>`));

  // 현재 스냅샷 카드
  main.appendChild(h(`<div class="snapnow">
    <div class="snapnowlabel">오늘 현재 순자산</div>
    <div class="snapnowval" style="color:${net>=0?'var(--good)':'var(--hot)'}">${net>=0?'+':'−'}${won(Math.abs(net))}원</div>
    <div class="snapnowsub">자산 ${won(totalAsset)} · 부채 ${won(totalDebt)}</div>
  </div>`));

  // 히스토리에서 일자별 마지막 순자산 뽑기 (오래된→최신)
  const withNet = state.history.filter(hh=>hh.net!==undefined);
  if(withNet.length<1){
    main.appendChild(h(`<div class="histempty">아직 기록이 부족합니다.<br>자산 탭에서 금액을 수정하면 그 시점의 순자산이 여기에 쌓입니다.</div>`));
    return;
  }
  // 날짜별로 그 날 마지막 값만 (히스토리는 최신순이라, 각 날짜의 첫 등장이 그날 최신)
  const seen={}; const daily=[];
  withNet.forEach(hh=>{ const key=hh.fullDate||hh.date; if(!seen[key]){ seen[key]=1; daily.push(hh); } });
  daily.reverse(); // 오래된→최신
  // 현재값을 마지막 점으로 추가
  const points=[...daily.map(hh=>({label:esc(hh.date), net:hh.net})), {label:"오늘", net}];

  // SVG 라인차트
  const W=428, H=180, pad=8;
  const nets=points.map(p=>p.net);
  let mn=Math.min(...nets,0), mx=Math.max(...nets,0);
  if(mn===mx){ mn-=1000000; mx+=1000000; }
  const rng=mx-mn;
  const xstep = points.length>1 ? (W-pad*2)/(points.length-1) : 0;
  const yOf = v => pad + (H-pad*2) * (1 - (v-mn)/rng);
  const xOf = i => pad + xstep*i;
  const zeroY = yOf(0);
  const linePts = points.map((p,i)=>`${xOf(i)},${yOf(p.net)}`).join(" ");
  const areaPts = `${xOf(0)},${zeroY} ${linePts} ${xOf(points.length-1)},${zeroY}`;
  const lastNet = points[points.length-1].net;
  const lineColor = lastNet>=0 ? "#2f9e44" : "#e8590c";

  const chart=h(`<div class="chartwrap">
    <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block">
      <line x1="${pad}" y1="${zeroY}" x2="${W-pad}" y2="${zeroY}" stroke="#d0d0d8" stroke-width="1" stroke-dasharray="3 3"/>
      <polygon points="${areaPts}" fill="${lineColor}" opacity="0.08"/>
      <polyline points="${linePts}" fill="none" stroke="${lineColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${points.map((p,i)=>`<circle cx="${xOf(i)}" cy="${yOf(p.net)}" r="3.5" fill="#fff" stroke="${lineColor}" stroke-width="2"/>`).join("")}
    </svg>
    <div class="chartxlabels">${points.map(p=>`<span>${p.label}</span>`).join("")}</div>
    <div class="chartzero">0원 기준선</div>
  </div>`);
  main.appendChild(chart);

  // 일자별 스냅샷 리스트 (최신순)
  main.appendChild(h(`<div class="histhead"><span class="histtitle">일자별 자산 현황</span><span class="histcount">${daily.length}일</span></div>`));
  const listRev=[...daily].reverse(); // 최신순
  // 직전 대비 증감 계산
  listRev.forEach((hh,idx)=>{
    const prevItem = listRev[idx+1];
    const delta = prevItem ? hh.net - prevItem.net : null;
    const up = delta!==null && delta>=0;
    main.appendChild(h(`<div class="snapcard">
      <div class="snapleft"><div class="snapdate">${esc(hh.date)}</div><div class="snapreason">${esc(hh.name)}${hh.reason?' · '+esc(hh.reason):''}</div></div>
      <div class="snapright">
        <div class="snapnet" style="color:${hh.net>=0?'var(--good)':'var(--hot)'}">${hh.net>=0?'+':'−'}${won(Math.abs(hh.net))}</div>
        <div class="snapdetail">자산 ${won(hh.totalAsset)} · 부채 ${won(hh.totalDebt)}</div>
        ${delta!==null?`<div class="snapdelta" style="color:${up?'var(--good)':'var(--hot)'}">전일 대비 ${up?'▲':'▼'} ${won(Math.abs(delta))}</div>`:''}
      </div>
    </div>`));
  });
}

function renderAssets(main, totalAsset){
  main.appendChild(h(`<div class="hint">💰 예금·주식 계좌를 개별 관리하세요. 입력창을 누르면 기존 금액이 아래에 표시됩니다.</div>`));
  const pasteBtn = h(`<button class="pastebtn">📋 은행 알림·문자 붙여넣어 잔액 자동 반영</button>`);
  pasteBtn.onclick=()=>{ ui.modal={type:"paste"}; render(); };
  main.appendChild(pasteBtn);
  if(!state.assets.length) main.appendChild(h(`<div class="histempty" style="margin-bottom:12px">등록된 계좌가 없습니다.<br>아래 버튼으로 계좌를 추가하거나, 상단 💾에서 백업 파일을 복원하세요.</div>`));
  ["주식","예금","현금","기타"].forEach(kind=>{
    const list = state.assets.filter(a=>a.kind===kind);
    if(!list.length) return;
    const sum = list.reduce((s,a)=>s+a.amount,0);
    const g = h(`<div class="agroup">
      <div class="ghead"><span class="dot" style="background:${KIND_COLORS[kind]}"></span><span class="gname">${kind}</span><span class="gsum">${won(sum)}원</span></div>
    </div>`);
    list.forEach(a=>{
      const customLink = (a.link && a.link.trim()) ? a.link.trim() : "";
      const linkBtn = `<button class="linkbtn">${customLink?'📲':'🔗'}</button>`;
      const card = h(`<div class="acard">
        <div class="atop">
          <div class="aname">${esc(a.name)}${linkBtn}</div>
          <div class="aright">
            <input class="ainput" type="text" inputmode="numeric" placeholder="0" value="${a.amount===0?'':won(a.amount)}" />
            <span class="awon">원</span>
            <button class="del">🗑</button>
          </div>
        </div>
        <div class="prevhint" style="display:none"></div>
      </div>`);
      const lb=card.querySelector(".linkbtn");
      if(lb) lb.onclick=(e)=>{
        e.stopPropagation();
        if(customLink) openLink(customLink);
        else ui.modal={type:"applink", target:"asset", id:a.id, name:a.name};
        if(!customLink) render();
      };
      const input = card.querySelector(".ainput");
      const hint = card.querySelector(".prevhint");
      const updateHint = (dn)=>{
        hint.innerHTML=`기존 보유금액 <b>${won(a.amount)}원</b>${dn>0&&dn!==a.amount?` <span style="color:${dn>a.amount?'var(--good)':'var(--hot)'};font-weight:700;margin-left:8px">${dn>a.amount?'▲':'▼'} ${won(Math.abs(dn-a.amount))}</span>`:''}`;
      };
      input.onfocus = ()=>{
        ui.focusAsset=a.id;
        card.classList.add("focus"); input.classList.add("focus");
        hint.style.display="block"; updateHint(a.amount);
      };
      input.oninput = (e)=>{
        const raw=e.target.value.replace(/[^0-9]/g,'');
        const formatted = raw===''?'':Number(raw).toLocaleString('ko-KR');
        e.target.value=formatted;
        try{ const L=formatted.length; e.target.setSelectionRange(L,L); }catch(_){}
        updateHint(Number(raw)||0);
      };
      input.onblur = ()=>{
        const next=Number(String(input.value).replace(/,/g,''))||0;
        ui.focusAsset=null;
        if(next!==a.amount){ ui.modal={type:"reason", id:a.id, name:a.name, prev:a.amount, next}; render(); }
        else { card.classList.remove("focus"); input.classList.remove("focus"); hint.style.display="none"; }
      };
      card.querySelector(".del").onclick = ()=>{ if(confirm(a.name+' 계좌를 삭제할까요?')){ state.assets=state.assets.filter(x=>x.id!==a.id); save(); render(); } };
      g.appendChild(card);
    });
    main.appendChild(g);
  });
  const add = h(`<button class="addbtn">＋ 계좌·자산 추가</button>`);
  add.onclick=()=>{ ui.modal={type:"addAsset"}; render(); };
  main.appendChild(add);

  // 변동내역
  main.appendChild(h(`<div class="histhead"><span class="histtitle">자산 변동내역</span>${state.history.length?`<span class="histcount">${state.history.length}건</span>`:''}</div>`));
  if(!state.history.length){
    main.appendChild(h(`<div class="histempty">아직 변동내역이 없습니다.<br>주식·예금 금액을 수정하면 일자별로 기록됩니다.</div>`));
  } else {
    const shown = ui.showAllHist ? state.history : state.history.slice(0,5);
    shown.forEach(hh=>{
      const up = hh.next>=hh.prev;
      const hc=h(`<div class="histcard">
        <div><div class="hdate">${esc(hh.date)}</div><div class="hname">${esc(hh.name)}</div><div class="hreason">${esc(hh.reason)||'사유 없음'}</div></div>
        <div class="hright"><div class="hdelta" style="color:${up?'var(--good)':'var(--hot)'}">${up?'+':'−'}${won(Math.abs(hh.next-hh.prev))}</div><div class="hflow">${won(hh.prev)} → ${won(hh.next)}</div></div>
        <button class="del">✕</button>
      </div>`);
      hc.querySelector(".del").onclick=()=>{
        if(confirm('이 변동내역을 삭제할까요?\n(기록만 지워지고 계좌 금액은 그대로입니다. 추이·수익 집계에서도 빠집니다)')){ state.history=state.history.filter(x=>x.id!==hh.id); save(); render(); }
      };
      main.appendChild(hc);
    });
    if(state.history.length>5){
      const mb=h(`<button class="histmore">${ui.showAllHist?'접기':'전체 '+state.history.length+'건 보기'}</button>`);
      mb.onclick=()=>{ ui.showAllHist=!ui.showAllHist; render(); };
      main.appendChild(mb);
    }
  }
}

function renderHome(main){
  const sched = [...state.loans].filter(l=>!state.paid[l.id] && monthlyPayment(l)>0).map(l=>({...l, diff:daysUntilPay(l.payDay)})).sort((a,b)=>a.diff-b.diff);
  main.appendChild(h(`<div class="hint">📅 납입일이 가까운 순서. 체크하면 완료 처리되고, 원리금 대출은 원금 상환분을 잔액에서 차감할 수 있습니다. 체크는 매월 1일 초기화됩니다.</div>`));
  if(!sched.length) main.appendChild(h(`<div class="donecard">✓ 이번 달 납입을 모두 체크했습니다.</div>`));
  sched.forEach(l=>{
    const card=h(`<div class="paycard ${l.diff<=2?'urgent':''}">
      <button class="chk"><span class="chkempty"></span></button>
      <div class="pinfo"><div class="plender">${esc(l.lender)}</div><div class="pmeta">매월 ${l.payDay}일 · ${l.type} · ${l.rate===0?'무이자':l.rate.toFixed(2)+'%'}</div></div>
      <div class="pright"><div class="pamt">${won(monthlyPayment(l))}</div><div class="pdday ${l.diff<=2?'urgent':''}">${l.diff===0?'오늘':'D-'+l.diff}</div></div>
    </div>`);
    card.querySelector(".chk").onclick=()=>{
      // 원리금 대출은 납입액 중 원금 상환분만큼 잔액을 줄일지 물어본다
      const principal=principalPortion(l);
      let deducted=0;
      if(principal>0 && confirm(`${l.lender} 납입 완료 처리합니다.\n\n원금 상환분 ${won(principal)}원을 대출 잔액에서 차감할까요?\n${won(l.balance)}원 → ${won(l.balance-principal)}원\n\n[확인] 잔액 차감  /  [취소] 체크만 (잔액 그대로)`)) deducted=principal;
      if(deducted>0) state.loans=state.loans.map(x=>x.id===l.id?{...x,balance:x.balance-deducted}:x);
      state.paid[l.id]={principal:deducted};
      save(); render();
    };
    main.appendChild(card);
  });
  const done = state.loans.filter(l=>state.paid[l.id]);
  if(done.length){
    main.appendChild(h(`<div class="paidhead">납입 완료</div>`));
    done.forEach(l=>{
      const deducted=(state.paid[l.id]&&state.paid[l.id].principal)||0;
      const card=h(`<div class="paycard done">
        <button class="chk"><span class="chkdone">✓</span></button>
        <div class="pinfo"><div class="plender struck">${esc(l.lender)}</div><div class="pmeta">완료${deducted>0?' · 원금 '+won(deducted)+'원 차감됨':''}</div></div>
        <div class="pamt mut">${won(monthlyPayment(l))}</div>
      </div>`);
      card.querySelector(".chk").onclick=()=>{
        // 체크 해제 시 차감했던 원금을 되돌린다
        if(deducted>0) state.loans=state.loans.map(x=>x.id===l.id?{...x,balance:x.balance+deducted}:x);
        delete state.paid[l.id]; save(); render();
      };
      main.appendChild(card);
    });
  }
}

function renderYear(main){
  main.appendChild(h(`<div class="hint">📅 월별 상환 예정액(최초 원금 기준). 월을 누르면 상세가 열립니다.</div>`));
  // 현재 월부터 앞으로 24개월 생성
  const base=new Date();
  const months=[];
  for(let i=0;i<24;i++){
    const d=new Date(base.getFullYear(), base.getMonth()+i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  const curYMlocal=`${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,"0")}`;

  months.forEach(ym=>{
    const [yy,mm]=ym.split("-").map(Number);
    // 정기 상환 + 만기 일시상환
    const items=[];
    state.loans.forEach(l=>{
      const amt=paymentInMonth(l,ym);
      if(amt>0) items.push({loan:l, amt, isMaturity:false});
      const mat=maturityInMonth(l,ym);
      if(mat>0) items.push({loan:l, amt:mat, isMaturity:true});
    });
    items.sort((a,b)=>a.loan.payDay-b.loan.payDay);
    const total=items.reduce((s,x)=>s+x.amt,0);
    const hasMaturity=items.some(x=>x.isMaturity);
    const isCur=ym===curYMlocal, isOpen=ui.openMonth===ym;
    if(items.length===0) return; // 상환 없는 달은 생략
    const card=h(`<div class="monthcard ${isCur?'cur':''}">
      <button class="mhead"><div class="mleft"><span class="mnum ${isCur?'cur':''}">${yy}년 ${mm}월</span>${isCur?'<span class="curbadge">이번 달</span>':''}${hasMaturity?'<span class="matmini">만기</span>':''}</div><div class="mright"><span class="mtotal">${won(total)}원</span><span class="chev ${isOpen?'open':''}">▶</span></div></button>
      ${isOpen?`<div class="mbody">${items.map(({loan,amt,isMaturity})=>`<div class="mitem"><span class="miday">${loan.payDay}일</span><span class="miname">${esc(loan.lender)}</span><span class="mitype ${isMaturity?'mat':''}">${isMaturity?'원금만기':(loan.type==='원리금'?'원리금':'이자')}</span><span class="miamt">${won(amt)}</span></div>`).join('')}</div>`:''}
    </div>`);
    card.querySelector(".mhead").onclick=()=>{ ui.openMonth=isOpen?null:ym; render(); };
    main.appendChild(card);
  });
}

function renderPriority(main){
  const byPrio=[...state.loans].sort((a,b)=>b.rate-a.rate);
  main.appendChild(h(`<div class="hint">📉 금리 높은 순. 상환 버튼으로 조기상환 효과(수수료 포함)를 계산합니다.</div>`));
  byPrio.forEach((l,i)=>{
    const feeTag = (l.prepayFeeRate>0) ? `<span class="feetag">수수료 ${l.prepayFeeRate}%</span>` : '';
    const card=h(`<div class="priocard">
      <div class="rank ${i<2?'hot':''}">${i+1}</div>
      <div class="prinfo"><div class="plender">${esc(l.lender)}${feeTag}</div><div class="pmeta">잔액 ${won(l.balance)}원 · 월이자 ${won(monthlyInterest(l.balance,l.rate))}</div></div>
      <div class="prright"><div class="ratebadge ${i<2?'hot':''}">${l.rate===0?'무이자':l.rate.toFixed(2)+'%'}</div><button class="simbtn">상환 ▶</button></div>
    </div>`);
    card.querySelector(".simbtn").onclick=()=>{ ui.modal={type:"sim", id:l.id, amount:""}; render(); };
    main.appendChild(card);
  });

  // ── 재정 건전화 팁 (동적) ──
  const tips=[];
  const loans=state.loans;
  const totalDebt=loans.reduce((s,l)=>s+l.balance,0);
  const totalAsset=state.assets.reduce((s,a)=>s+a.amount,0);
  const mInt=loans.reduce((s,l)=>s+monthlyInterest(l.balance,l.rate),0);

  // 1. 무수수료 고금리 대출 = 최우선
  const noFeeHigh=loans.filter(l=>l.rate>=10 && (!l.prepayFeeRate||l.prepayFeeRate===0)).sort((a,b)=>b.rate-a.rate);
  if(noFeeHigh.length){
    tips.push(`<b>${esc(noFeeHigh[0].lender)}(${noFeeHigh[0].rate.toFixed(1)}%)</b>은 금리가 높고 중도상환수수료가 없어 <b>여윳돈이 생기면 1순위로 갚는 게</b> 가장 이득입니다.`);
  }
  // 2. 수수료 있는 대출 주의
  const withFee=loans.filter(l=>l.prepayFeeRate>0);
  if(withFee.length){
    tips.push(`${withFee.map(l=>esc(l.lender)).join(', ')}은 중도상환수수료가 있어, 갚기 전에 <b>상환 시뮬레이션의 '실질 이득'</b>을 꼭 확인하세요. 만기가 가까우면 유지가 나을 수 있습니다.`);
  }
  // 3. 무이자 대출은 후순위
  const noInt=loans.filter(l=>l.rate===0);
  if(noInt.length){
    tips.push(`${noInt.map(l=>esc(l.lender)).join(', ')}은 무이자라 <b>서두를 필요가 없습니다.</b> 이자 나가는 대출부터 정리하세요.`);
  }
  // 4. 예금 vs 대출 금리차
  if(totalAsset>0){
    const highestRate=Math.max(...loans.map(l=>l.rate));
    if(highestRate>=5){
      tips.push(`예금 이자율보다 대출 금리(최고 ${highestRate.toFixed(1)}%)가 훨씬 높습니다. <b>노는 예금이 있다면 고금리 대출 상환에 쓰는 게</b> 사실상 그 금리만큼 버는 셈입니다.`);
    }
  }
  // 5. 이자 부담 요약
  tips.push(`현재 매달 <b>${won(mInt)}원</b>이 이자로 나갑니다(연 ${won(mInt*12)}원). 고금리부터 원금을 줄이면 이 금액이 직접 줄어듭니다.`);

  const tipCard=h(`<div class="tipbox"><div class="tiphead">💡 재정 건전화 팁</div>${tips.map(t=>`<div class="tipline">${t}</div>`).join('')}</div>`);
  main.appendChild(tipCard);
}

function renderModal(){
  const m=ui.modal;
  const bg=h(`<div class="modalbg"></div>`);
  bg.onclick=()=>{ if(m.type==="reason"){ ui.focusAsset=null; } ui.modal=null; render(); };
  const box=h(`<div class="modal"></div>`);
  box.onclick=e=>e.stopPropagation();

  if(m.type==="reason"){
    const diff=m.next-m.prev, up=diff>=0;
    const presets = up?["급여·입금","주식 상승","이자·배당","매도 정산"]:["생활비 지출","주식 하락","대출 상환","카드값"];
    box.innerHTML=`
      <div class="mdhead"><span>${esc(m.name)} 변동 사유</span><button class="mdclose">✕</button></div>
      <div class="rflow"><span>${won(m.prev)}</span><span style="color:#adb5bd">▶</span><span style="font-weight:800">${won(m.next)}원</span><span style="margin-left:auto;font-weight:800;color:${up?'var(--good)':'var(--hot)'}">${up?'+':'−'}${won(Math.abs(diff))}</span></div>
      <label class="lbl">왜 변동됐나요?</label>
      <div class="presetrow">${presets.map(p=>`<button class="preset" data-p="${p}">${p}</button>`).join('')}</div>
      <input class="in reasoninput" style="margin-top:10px" placeholder="직접 입력 (예: 삼성전자 매도)" />
      <button class="apply">기록하기</button>
      <button class="skip">사유 없이 저장</button>`;
    box.querySelector(".mdclose").onclick=()=>{ ui.focusAsset=null; ui.modal=null; render(); };
    let reason="";
    const rin=box.querySelector(".reasoninput");
    box.querySelectorAll(".preset").forEach(b=>b.onclick=()=>{ reason=b.dataset.p; rin.value=reason; box.querySelectorAll(".preset").forEach(x=>x.classList.remove("on")); b.classList.add("on"); });
    rin.oninput=e=>{ reason=e.target.value; };
    const commit=(r)=>{
      applyAssetChange(m.id, m.next, r);
      ui.focusAsset=null; ui.modal=null; save(); render();
    };
    box.querySelector(".apply").onclick=()=>commit(reason);
    box.querySelector(".skip").onclick=()=>commit("");
  }

  else if(m.type==="sim"){
    const l=state.loans.find(x=>x.id===m.id);
    const feeRate=l.prepayFeeRate||0;
    const feeInfo = feeRate>0 ? `<div class="mdsub">중도상환수수료 ${feeRate}%${l.prepayType==='슬라이딩'?' (잔여기간 비례)':''}</div>` : '';
    box.innerHTML=`
      <div class="mdhead"><span>${esc(l.lender)} 조기상환</span><button class="mdclose">✕</button></div>
      <div class="mdsub">현재 잔액 ${won(l.balance)}원 · ${l.rate===0?'무이자':l.rate.toFixed(2)+'%'}</div>
      ${feeInfo}
      <label class="lbl">상환할 금액</label>
      <input class="in siminput" type="text" inputmode="numeric" placeholder="예: 5,000,000" />
      <div class="simarea"></div>
      <button class="apply">상환 반영하기</button>`;
    box.querySelector(".mdclose").onclick=()=>{ ui.modal=null; render(); };
    const si=box.querySelector(".siminput"), area=box.querySelector(".simarea"), applyBtn=box.querySelector(".apply");
    // 수수료 계산: 슬라이딩이면 잔여기간 비례
    const calcFee=(amt)=>{
      if(feeRate<=0) return 0;
      let f = amt*(feeRate/100);
      if(l.prepayType==='슬라이딩' && l.maturityYM){
        const [my,mm]=l.maturityYM.split("-").map(Number);
        const now=new Date();
        const monthsLeft=Math.max(0,(my-now.getFullYear())*12+(mm-(now.getMonth()+1)));
        const totalMonths=l.months||36;
        f = f * Math.min(1, monthsLeft/totalMonths);
      }
      return f;
    };
    const update=()=>{
      const raw=si.value.replace(/[^0-9]/g,'');
      si.value = raw===''?'':Number(raw).toLocaleString('ko-KR');
      try{ const L=si.value.length; si.setSelectionRange(L,L); }catch(_){}
      const amt=Number(raw)||0;
      if(amt>0){
        const nb=Math.max(0,l.balance-amt), oi=monthlyInterest(l.balance,l.rate), ni=monthlyInterest(nb,l.rate);
        const yearSave=(oi-ni)*12;
        const fee=calcFee(amt);
        let rows=`<div class="simrow"><span>상환 후 잔액</span><b>${won(nb)}원</b></div><div class="simrow"><span>월 이자</span><b>${won(oi)} → ${won(ni)}</b></div><div class="simrow"><span>연간 이자 절감</span><b>${won(yearSave)}원</b></div>`;
        if(fee>0){
          const netFirst=yearSave-fee;
          const breakeven = yearSave>0 ? (fee/(yearSave/12)) : 999;
          rows+=`<div class="simrow" style="color:var(--hot)"><span>중도상환수수료</span><b>-${won(fee)}원</b></div>`;
          rows+=`<div class="simrow save" style="color:${netFirst>=0?'var(--good)':'var(--hot)'}"><span>1년차 실질 이득</span><b>${netFirst>=0?'+':'−'}${won(Math.abs(netFirst))}원</b></div>`;
          rows+=`<div class="simnote">${breakeven<=12?`약 ${Math.ceil(breakeven)}개월이면 수수료를 이자절감으로 회수합니다.`:`수수료 회수에 ${Math.ceil(breakeven)}개월 걸립니다. 만기가 가까우면 상환보다 유지가 유리할 수 있습니다.`}</div>`;
        }
        area.innerHTML=`<div class="simres">${rows}</div>`;
      } else area.innerHTML="";
    };
    si.oninput=update;
    applyBtn.onclick=()=>{
      const amt=numVal(si); if(!amt) return;
      state.loans=state.loans.map(x=>x.id===m.id?{...x,balance:Math.max(0,x.balance-amt)}:x).filter(x=>x.balance>0);
      ui.modal=null; save(); render();
    };
  }

  else if(m.type==="addAsset"){
    let kind="주식";
    box.innerHTML=`
      <div class="mdhead"><span>계좌·자산 추가</span><button class="mdclose">✕</button></div>
      <label class="lbl">이름</label><input class="in f-name" placeholder="예: 키움 계좌3, 신한 적금" />
      <label class="lbl">종류</label>
      <div class="segrow">${["주식","예금","현금","기타"].map(t=>`<button class="seg ${t==='주식'?'on':''}" data-k="${t}">${t}</button>`).join('')}</div>
      <label class="lbl">금액</label><input class="in f-amt" type="text" inputmode="numeric" placeholder="원" />
      <label class="lbl">접속 링크 <span>(선택 · 나중에 🔗 버튼으로도 설정 가능)</span></label><input class="in f-link" placeholder="https://... 또는 앱 링크" />
      <button class="apply">추가하기</button>`;
    box.querySelector(".mdclose").onclick=()=>{ ui.modal=null; render(); };
    attachComma(box.querySelector(".f-amt"));
    box.querySelectorAll(".seg").forEach(b=>b.onclick=()=>{ kind=b.dataset.k; box.querySelectorAll(".seg").forEach(x=>x.classList.remove("on")); b.classList.add("on"); b.style.background=KIND_COLORS[kind]; b.style.color="#fff"; });
    box.querySelector(".apply").onclick=()=>{
      const name=box.querySelector(".f-name").value.trim(); const amt=numVal(box.querySelector(".f-amt"));
      const link=box.querySelector(".f-link").value.trim();
      if(!name) return;
      state.assets=[...state.assets,{id:Date.now(),name,kind,amount:amt,link}];
      ui.modal=null; save(); render();
    };
  }

  else if(m.type==="addLoan" || m.type==="editLoan"){
    const editing = m.type==="editLoan";
    const orig = editing ? state.loans.find(x=>x.id===m.id) : null;
    let type = orig ? orig.type : "이자만";
    let feeType = orig && orig.prepayType ? orig.prepayType : "정률";
    let keep = orig ? {
      lender:orig.lender, bal:won(orig.balance), rate:String(orig.rate), orig:won(orig.orig||orig.balance),
      months:orig.months?String(orig.months):"", day:String(orig.payDay),
      fee:orig.prepayFeeRate?String(orig.prepayFeeRate):"", maturity:orig.maturityYM||"", link:orig.link||"", start:orig.startYM||""
    } : {lender:"",bal:"",rate:"",orig:"",months:"",day:"",fee:"",maturity:"",link:"",start:nowYM()};
    let formErr="";
    const draw=()=>{
      box.innerHTML=`
        <div class="mdhead"><span>${editing?'대출 수정':'대출 추가'}</span><button class="mdclose">✕</button></div>
        <label class="lbl">대출처</label><input class="in f-lender" placeholder="예: 신한은행" value="${esc(keep.lender)}" />
        <div class="frow">
          <div style="flex:1"><label class="lbl">현재 잔액</label><input class="in f-bal" type="text" inputmode="numeric" placeholder="원" value="${keep.bal}" /></div>
          <div style="width:110px"><label class="lbl">금리 %</label><input class="in f-rate" type="number" inputmode="decimal" placeholder="0.00" value="${keep.rate}" /></div>
        </div>
        <label class="lbl">최초 대출원금 <span>(원리금 기준 · 비우면 잔액 사용)</span></label><input class="in f-orig" type="text" inputmode="numeric" placeholder="원" value="${keep.orig}" />
        <label class="lbl">상환방식</label>

      box.querySelector(".mdclose").onclick=()=>{ ui.modal=null; render(); };

        if(startRaw && !isYM(startRaw)) return fail("상환 시작월은 2026-09 형식으로 입력하세요");
        const startYM=startRaw||(orig&&orig.startYM)||nowYM();
        const origP=numVal(box.querySelector(".f-orig"))||bal;
        if(editing){
          state.loans=state.loans.map(x=>x.id===m.id?{...x, lender, balance:bal, orig:origP, rate, type, months, payDay:day, startYM, prepayFeeRate:fee, prepayType:feeType, maturityYM, link}:x);
        } else {
          state.loans=[...state.loans,{id:Date.now(),lender,balance:bal,orig:origP,rate,type,months,payDay:day,startYM,prepayFeeRate:fee,prepayType:feeType,maturityYM,link,note:""}];
        }
        ui.modal=null; save(); render();
      };
    };
    draw();
  }

  else if(m.type==="move"){
    // 출처: 자산계좌들 + 외부수입 / 목적지: 대출상환 + 자산계좌들
    let kind="상환"; // 상환 | 이체
    let fromId="", toId="";
    const stockAssets=state.assets;
    const draw=()=>{
      const fromOpts = (kind==="상환")

        : stockAssets.map(a=>`<option value="A${a.id}">${esc(a.name)} (${won(a.amount)})</option>`).join("");

        if(fromV===toV){ toast("보내는 곳과 받는 곳이 같아요", 2000); return; }
        const {date,fullDate}=todayStamp();
        let fromName="", toName="";
        // 출처 차감
        if(fromV==="EXT"){ fromName="외부 수입"; }
        else if(fromV[0]==="A"){ const id=Number(fromV.slice(1)); const a=state.assets.find(x=>x.id===id); fromName=a?a.name:""; state.assets=state.assets.map(x=>x.id===id?{...x,amount:Math.max(0,x.amount-amt)}:x); }
        // 목적지 반영
        if(toV[0]==="L"){ const id=Number(toV.slice(1)); const l=state.loans.find(x=>x.id===id); toName=l?l.lender:""; state.loans=state.loans.map(x=>x.id===id?{...x,balance:Math.max(0,x.balance-amt)}:x).filter(x=>x.balance>0); }
        else if(toV[0]==="A"){ const id=Number(toV.slice(1)); const a=state.assets.find(x=>x.id===id); toName=a?a.name:""; state.assets=state.assets.map(x=>x.id===id?{...x,amount:x.amount+amt}:x); }
        state.moves=[{id:Date.now(),date,fullDate,kind,from:fromName,to:toName,amount:amt,memo},...(state.moves||[])];
        ui.modal=null; save(); render();

  else if(m.type==="applink"){
    const cur = m.target==="asset" ? (state.assets.find(x=>x.id===m.id)||{}) : (state.loans.find(x=>x.id===m.id)||{});

      <button class="apply savelink">저장</button>
      ${curLink?`<button class="skip clearlink" style="color:var(--hot)">연결 해제</button>`:''}
      <div class="applink-help">💡 앱을 여는 정확한 링크는, 해당 은행 앱에서 특정 화면의 <b>공유하기</b>를 눌러 복사한 뒤 위에 붙여넣으면 가장 정확합니다.</div>`;
    box.querySelector(".mdclose").onclick=()=>{ ui.modal=null; render(); };
    const linkInput=box.querySelector(".f-applink");
    box.querySelectorAll(".applink-preset").forEach(b=>b.onclick=()=>{
      // 안드로이드 intent 링크 생성 (앱 없으면 스토어)

  else if(m.type==="paste"){
    const targetOpts = `<optgroup label="자산">${state.assets.map(a=>`<option value="A${a.id}">${esc(a.name)} (${won(a.amount)})</option>`).join('')}</optgroup><optgroup label="대출">${state.loans.map(l=>`<option value="L${l.id}">${esc(l.lender)} (잔액 ${won(l.balance)})</option>`).join('')}</optgroup>`;
    box.innerHTML=`

    // 잔액이 문구에 있으면 그대로, 없으면 현재 금액 ± 거래금액으로 계산

      if(!parsed || !target.value) return;

        const cur=curOf(target.value);
        next = target.value[0]==="L" ? cur-parsed.txAmount : cur+(parsed.txIn?1:-1)*parsed.txAmount;
        next=Math.max(0,next);

      if(next!==null) newbal.value=won(next);
      applyBtn.disabled = newbal.value==="";

      if(!text.trim()){ parsed=null; note.textContent=""; return; }

      note.innerHTML = found.length

        : `금액을 찾지 못했어요. 아래에 잔액을 직접 입력해 주세요.`;
      fillBal();

    target.onchange=()=>{ if(parsed && parsed.balance===null) fillBal(); };
    box.querySelector(".clipbtn").onclick=async()=>{
      try{ ta.value=await navigator.clipboard.readText(); analyze(); }

    };
    applyBtn.onclick=()=>{
      const v=target.value; if(!v || newbal.value==="") return;

      ui.modal=null; save(); render();

  else if(m.type==="backup"){

      <div class="mdhead"><span>백업 · 복원</span><button class="mdclose">✕</button></div>

      <div class="mdsub">마지막 백업: <b>${last?esc(last):'없음'}</b> · 대출 ${state.loans.length}건 · 자산 ${state.assets.length}건 · 변동내역 ${state.history.length}건</div>

    box.querySelector(".mdclose").onclick=()=>{ ui.modal=null; render(); };
    box.querySelector(".doexport").onclick=()=>{
      const stamp=todayStamp().fullDate;
      const payload=JSON.stringify({app:"assetmgr", version:1, exportedAt:new Date().toISOString(), data:snapshot()}, null, 2);
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"}));
      a.download=`자산관리-백업-${stamp}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
      localStorage.setItem(BACKUP_KEY, stamp);
      ui.modal=null; render(); toast("백업 파일을 저장했어요", 2000);
    };
    const fileIn=box.querySelector(".f-file");
    box.querySelector(".doimport").onclick=()=>fileIn.click();
    fileIn.onchange=async()=>{
      const file=fileIn.files[0]; if(!file) return;

        const obj=JSON.parse(await file.text());

        if(!d || !Array.isArray(d.loans) || !Array.isArray(d.assets)) throw new Error("format");
        const when=obj.exportedAt ? new Date(obj.exportedAt).toLocaleString("ko-KR") : "날짜 미상";
        if(!confirm(`백업(${when})으로 복원할까요?\n\n복원 내용: 대출 ${d.loans.length}건 · 자산 ${d.assets.length}건\n현재 데이터(대출 ${state.loans.length}건 · 자산 ${state.assets.length}건)는 덮어써집니다.`)) return;

      : `<div class="mdsub" style="margin-top:12px">지문·안면인식은 앱을 인터넷 주소(https)로 설치했을 때 사용할 수 있어요.</div>`;
    box.innerHTML=`
      <div class="mdhead"><span>앱 잠금 설정</span><button class="mdclose">✕</button></div>
      <div class="mdsub">비밀번호는 이 기기에만 저장되며, 앱을 열 때마다 물어봅니다.</div>
      <button class="apply changepw">비밀번호 변경</button>
      ${bioRow}
      <button class="skip resetpw" style="color:var(--hot)">잠금 초기화 (다음 실행 때 새로 설정)</button>`;
    box.querySelector(".mdclose").onclick=()=>{ ui.modal=null; render(); };
    box.querySelector(".changepw").onclick=()=>{
      lockState={mode:"set",first:"",err:""};
      localStorage.removeItem(PW_KEY); localStorage.removeItem(PIN_KEY);
      ui.modal=null; render(); renderLock();
    };
    const bt=box.querySelector(".biotoggle");
    if(bt) bt.onclick=async()=>{
      if(bioOn){ localStorage.removeItem(BIO_KEY); localStorage.removeItem(BIO_ID_KEY); ui.modal=null; render(); }
      else { ui.modal=null; render(); await offerBiometric(); }
    };
    box.querySelector(".resetpw").onclick=()=>{
      localStorage.removeItem(PW_KEY); localStorage.removeItem(PIN_KEY); localStorage.removeItem(BIO_KEY); localStorage.removeItem(BIO_ID_KEY);
      ui.modal=null; render();
    };
  }

  bg.appendChild(box);
  app.appendChild(bg);
}

// ═══════════════ 설치 배너 ═══════════════
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; maybeInstallBar(); });
function maybeInstallBar(){
  if(document.querySelector(".installbar")) document.querySelector(".installbar").remove();
  const dismissed = sessionStorage.getItem("installDismiss");
  if(deferredPrompt && !dismissed){
    const bar=h(`<div class="installbar"><div><b>홈 화면에 앱 설치</b><p>설치하면 앱처럼 바로 열 수 있어요</p></div><button>설치</button></div>`);
    bar.querySelector("button").onclick=async()=>{ bar.remove(); deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; };
    document.body.appendChild(bar);
  }
}

// ═══════════════ 서비스워커 (설치 가능 PWA) ═══════════════
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

// ═══════════════ PIN 잠금 ═══════════════
const PIN_KEY = "assetmgr_pin";
const PW_KEY = "assetmgr_pw";
const BIO_KEY = "assetmgr_bio";
const BIO_ID_KEY = "assetmgr_bio_id";
async function sha(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
// https 환경에서만 생체인증(WebAuthn) 사용 가능
const bioAvailable = ()=> (location.protocol==="https:" || location.hostname==="localhost") && window.PublicKeyCredential;
let lockState = { mode:null, first:"", err:"" };

function renderLock(){
  // 기존 PIN 사용자 마이그레이션 안내: PW_KEY 없고 PIN_KEY 있으면 PIN으로 우선 동작
  const storedPw = localStorage.getItem(PW_KEY);
  const storedPin = localStorage.getItem(PIN_KEY);
  const hasCredential = storedPw || storedPin;
  if(lockState.mode===null) lockState.mode = hasCredential ? "enter" : "set";

  const titles = {
    set:["비밀번호 설정", "영문·숫자·기호를 조합해 6자 이상으로 정하세요"],
    confirm:["비밀번호 확인", "같은 비밀번호를 한 번 더 입력하세요"],
    enter:["잠금 해제", "비밀번호를 입력하세요"],
  };
  const [title, sub] = titles[lockState.mode];

  // 비밀번호 강도 표시(설정 시)
  const showStrength = lockState.mode==="set";
  const bioBtn = (lockState.mode==="enter" && localStorage.getItem(BIO_KEY)==="1" && bioAvailable())
    ? `<button class="biobtn">👆 지문·안면으로 잠금 해제</button>` : "";

  const lock = h(`<div class="lockscreen">
    <div class="lockicon">🔒</div>
    <div class="locktitle">${title}</div>
    <div class="locksub">${sub}</div>
    <div class="pwwrap">
      <input class="pwinput" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="비밀번호" />
      <button class="pwtoggle" type="button">👁</button>
    </div>
    ${showStrength?`<div class="pwstrength"><div class="pwbar"><div class="pwbarfill"></div></div><div class="pwhint">6자 이상 · 영문+숫자+기호 조합 권장</div></div>`:''}
    <div class="pinerr">${lockState.err}</div>
    <button class="pwsubmit">${lockState.mode==='enter'?'잠금 해제':(lockState.mode==='confirm'?'확인':'다음')}</button>
    ${bioBtn}
  </div>`);

  const input = lock.querySelector(".pwinput");
  const submitBtn = lock.querySelector(".pwsubmit");
  const toggle = lock.querySelector(".pwtoggle");
  toggle.onclick=()=>{ input.type = input.type==="password" ? "text" : "password"; input.focus(); };

  // 강도 표시
  if(showStrength){
    input.oninput=()=>{
      const v=input.value;
      let score=0;
      if(v.length>=6) score++;
      if(v.length>=10) score++;
      if(/[a-zA-Z]/.test(v)&&/[0-9]/.test(v)) score++;
      if(/[^a-zA-Z0-9]/.test(v)) score++;
      const fill=lock.querySelector(".pwbarfill");
      const colors=["#e8590c","#e8850c","#e0b000","#2f9e44"];
      const w=[25,50,75,100][Math.max(0,score-1)]||10;
      fill.style.width=w+"%";
      fill.style.background=colors[Math.max(0,score-1)]||"#e8590c";
    };
  }

  const submit=()=>handleSubmit(input.value);
  submitBtn.onclick=submit;
  input.onkeydown=(e)=>{ if(e.key==="Enter") submit(); };

  const bio=lock.querySelector(".biobtn");
  if(bio) bio.onclick=()=>tryBiometric();

  document.body.appendChild(lock);
  setTimeout(()=>input.focus(),100);
}

async function handleSubmit(val){
  const v=(val||"").trim();
  if(lockState.mode==="set"){
    if(v.length<6){ lockState.err="6자 이상 입력하세요"; refreshErr(); return; }
    lockState.first=v; lockState.mode="confirm"; lockState.err="";
    document.querySelector(".lockscreen").remove(); renderLock();
  } else if(lockState.mode==="confirm"){
    if(v===lockState.first){
      localStorage.setItem(PW_KEY, await sha(v));
      localStorage.removeItem(PIN_KEY); // 기존 PIN 제거
      // 생체인증 등록 제안(https 환경만)
      if(bioAvailable()){ await offerBiometric(); }
      unlock();
    } else {
      lockState.first=""; lockState.mode="set"; lockState.err="비밀번호가 일치하지 않아요. 다시 설정하세요";
      document.querySelector(".lockscreen").remove(); renderLock();
    }
  } else { // enter
    const hashed=await sha(v);
    const storedPw=localStorage.getItem(PW_KEY);
    const storedPin=localStorage.getItem(PIN_KEY);
    if((storedPw && hashed===storedPw) || (!storedPw && storedPin && hashed===storedPin)){ unlock(); }
    else { lockState.err="비밀번호가 틀렸어요"; refreshErr(); if(navigator.vibrate) navigator.vibrate(200); }
  }
}
function refreshErr(){
  const lock=document.querySelector(".lockscreen"); if(!lock) return;
  lock.querySelector(".pinerr").textContent = lockState.err;
}

// ── 생체인증(WebAuthn) — https 환경 전용 ──
async function offerBiometric(){
  try{
    if(!bioAvailable()) return;
    const ok=confirm("지문·안면인식으로도 잠금을 해제할까요?");
    if(!ok) return;
    const cred=await navigator.credentials.create({
      publicKey:{
        challenge:crypto.getRandomValues(new Uint8Array(32)),
        rp:{name:"자산관리"},
        user:{id:crypto.getRandomValues(new Uint8Array(16)), name:"user", displayName:"사용자"},
        pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
        authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required"},
        timeout:60000
      }
    });
    if(cred){
      localStorage.setItem(BIO_KEY,"1");
      // 잠금 해제 때 이 기기의 자격증명을 지정할 수 있도록 ID 보관
      localStorage.setItem(BIO_ID_KEY, btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));
    }
  }catch(e){ /* 등록 취소/실패 무시 */ }
}
async function tryBiometric(){
  try{
    const pk={ challenge:crypto.getRandomValues(new Uint8Array(32)), userVerification:"required", timeout:60000 };
    const savedId=localStorage.getItem(BIO_ID_KEY);
    if(savedId) pk.allowCredentials=[{type:"public-key", id:Uint8Array.from(atob(savedId),c=>c.charCodeAt(0))}];
    const res=await navigator.credentials.get({ publicKey:pk });
    if(res) unlock();
  }catch(e){ lockState.err="생체인증에 실패했어요. 비밀번호를 입력하세요"; refreshErr(); }
}

function unlock(){ const lock=document.querySelector(".lockscreen"); if(lock) lock.remove(); render(); }

renderLock();
</script>
